# Builds the MidFood phone app on Expo's build service (EAS).
#
# Run it by hand from GitHub → Actions → "Mobile app build" → Run workflow,
# choosing what to build:
#   apk        installable Android file for testing on a phone (preview profile)
#   android    Play Store bundle (.aab, production profile)
#   ios        App Store build (production profile; needs Apple credentials in EAS)
#   preview    no native build: publishes the app's JavaScript to Expo's
#              "preview" channel. Expo Go (App Store / Play Store) signed in
#              as the g8-vip account then opens it on any phone, iPhone
#              included — the quick way to look at the app without a store
#              account. Builds made with the preview profile also pick up
#              these updates on launch.
#
# Needs one repository secret: EXPO_TOKEN, an access token from
# expo.dev → account settings → Access tokens. The build itself runs on Expo's
# servers; this job only hands the code over and waits for the result, then
# prints the download link and saves it as a job artifact.
name: Mobile app build

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        required: true
        default: apk
        options:
          - apk
          - android
          - ios
          - preview

concurrency:
  group: mobile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview update (Expo Go)
        if: inputs.target == 'preview'
        run: |
          eas update --channel preview --message "${GITHUB_SHA::7} ${{ github.event.head_commit.message || 'manual' }}" --non-interactive --json > update.json
          cat update.json
          echo "### Preview published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open **Expo Go** on the phone, signed in as g8-vip → Projects → **G8 MidFood** → branch **preview**." >> "$GITHUB_STEP_SUMMARY"
          node -e "const u=require('./update.json'); for (const x of (Array.isArray(u)?u:[u])) console.log(x.platform, x.id, x.group||'')" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build
        if: inputs.target != 'preview'
        id: build
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            apk)     PLATFORM=android; PROFILE=preview ;;
            android) PLATFORM=android; PROFILE=production ;;
            ios)     PLATFORM=ios;     PROFILE=production ;;
          esac
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait --json > build.json
          cat build.json
          BUILD_ID=$(node -e "const b=require('./build.json'); console.log((Array.isArray(b)?b[0]:b).id)")
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Waiting for build $BUILD_ID on Expo's servers..."
          eas build:view "$BUILD_ID" --json > view.json || true
          # Poll until the build finishes (eas build --wait would also work, but
          # polling keeps the log readable and survives a flaky connection).
          for i in $(seq 1 120); do
            eas build:view "$BUILD_ID" --json > view.json
            STATUS=$(node -e "console.log(require('./view.json').status)")
            echo "[$i] $STATUS"
            case "$STATUS" in
              FINISHED) break ;;
              ERRORED|CANCELED) echo "Build $STATUS"; cat view.json; exit 1 ;;
            esac
            sleep 30
          done
          URL=$(node -e "const v=require('./view.json'); console.log((v.artifacts&&(v.artifacts.applicationArchiveUrl||v.artifacts.buildUrl))||'')")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$TARGET** — download: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Also listed at https://expo.dev under the project's Builds." >> "$GITHUB_STEP_SUMMARY"

      - name: Download the file
        if: steps.build.outputs.url != ''
        run: |
          mkdir -p out
          case "${{ inputs.target }}" in
            apk) NAME=MidFood.apk ;;
            android) NAME=MidFood.aab ;;
            ios) NAME=MidFood.ipa ;;
          esac
          curl -sSL -o "out/$NAME" "${{ steps.build.outputs.url }}"
          ls -la out

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.url != ''
        with:
          name: midfood-${{ inputs.target }}
          path: mobile/out/*
          retention-days: 30

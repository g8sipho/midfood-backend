# Render "Blueprint" — deploys the backend and a managed Postgres together.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file and
# provisions both resources, wiring DATABASE_URL automatically.
#
# If this repo's structure changes so the backend isn't at the top level
# (e.g. once /mobile is added alongside it), keep `rootDir: backend` below
# pointed at wherever this package.json actually lives, and move this file
# to the repo root — Render looks for render.yaml there.
#
# Plan names (starter/standard/etc.) and free-tier availability change on
# Render's side from time to time — double-check current options in the
# Render dashboard before deploying, and adjust the `plan` values below if
# they've been renamed or retired.
#
# The four PAYFAST_* values are marked `sync: false`: they are set by hand in
# the Render dashboard (midfood-backend -> Environment) and this file must
# never overwrite them. They hold the live merchant account's details, and a
# deploy that quietly put test values back would stop MidFood taking money.
# For a test copy of MidFood, PayFast's shared sandbox values are
# PAYFAST_MODE=sandbox, merchant id 10004002, merchant key q1cd2rdny4a53,
# passphrase "payfast".

services:
  - type: web
    name: midfood-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PGSSL
        value: 'true'
      - key: ADMIN_KEY
        generateValue: true
      - key: PAYFAST_MODE
        sync: false
      # Leave blank: the app and the portal/driver pages are served from this
      # same host, so no other website needs cross-origin access. Add a
      # comma-separated list only if a separate web front-end is ever added.
      - key: ALLOWED_ORIGINS
        value: ''
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: midfood-db
          property: connectionString

databases:
  - name: midfood-db
    plan: basic-256mb
    databaseName: midfood
    user: midfood
